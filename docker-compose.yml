version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cforge-postgres
    environment:
      POSTGRES_DB: cforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  cforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cforge-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./results:/app/results

volumes:
  pgdata:
